server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy: take the client address from X-Forwarded-For, trusting only
    # private/loopback hops, and pass it on as X-Real-IP (used to throttle invalid keys).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Same-origin API: no CORS, no build-time API URL.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        # Server-Sent Events: stream tokens as they arrive, and tell an outer nginx to do
        # the same (it honours X-Accel-Buffering only if we pass it through).
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
