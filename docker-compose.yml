services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      RAG_PROJECT_ROOT: /app
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /app/data/rag.db
      DOCS_REPO_PATH: /app/data/kubernetes-website
      MODEL_CACHE_PATH: /app/data/models
      EVAL_PATH: /app/eval/questions.jsonl
      API_PRICING_PATH: /app/data/billing/pricing.json
      HF_HOME: /app/data/models
      HF_HUB_CACHE: /app/data/models
      XDG_CACHE_HOME: /app/data/models/.cache
      TMPDIR: /app/.tmp
    ports:
      - "8088:8000"
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
