services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      RAG_PROJECT_ROOT: /app
      API_PRICING_PATH: /app/data/billing/pricing.json
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: ${DOCKER_SQLITE_PATH:-/app/data/rag.db}
      DOCS_REPO_PATH: /app/data/kubernetes-website
      EVAL_PATH: /app/eval/questions.jsonl
      MODEL_CACHE_PATH: /app/data/models
      TMPDIR: /app/.tmp
      TEMP: /app/.tmp
      TMP: /app/.tmp
      HF_HOME: /app/data/models
      HF_HUB_CACHE: /app/data/models
      XDG_CACHE_HOME: /app/data/models/.cache
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    ports:
      - "8088:8000"
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
      - ./.tmp:/app/.tmp
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8088}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
