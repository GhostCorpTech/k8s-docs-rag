[project]
name = "kubernetes-docs-rag"
version = "0.1.0"
description = "Hybrid RAG assistant for Kubernetes documentation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "openai>=1.60,<2",
  "fastembed>=0.6,<1",
  "tokenizers>=0.20,<1",
  "qdrant-client>=1.13,<1.14",
  "python-frontmatter>=1.1,<2",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "httpx>=0.28,<1",
  "pytest-cov>=6,<8",
]

[project.scripts]
k8s-rag = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
